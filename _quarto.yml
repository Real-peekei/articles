project:
  type: website
  output-dir: docs

website:
  title: "Peekei"
  description: "Applied biostatistics, computational biology, and genomics — worked examples, methods notes, and reproducible analyses."
  navbar:
    left:
      - href: index.qmd
        text: Articles
      - href: about.qmd
        text: About
      - href: https://github.com/Real-peekei/omicsuite
        text: omicsuite
    right:
      - icon: github
        href: https://github.com/Real-peekei
        aria-label: GitHub
  page-footer:
    left: "© Peekei"
    right: "Built with [Quarto](https://quarto.org)"
    border: true

format:
  html:
    theme: [flatly, custom.scss]
    highlight-style: github
    toc: true
    toc-float: true
    fig-caption: true
    fig-cap-location: bottom
    code-fold: false
    grid:
      body-width: 780px
      sidebar-width: 250px
      margin-width: 200px
    smooth-scroll: true

execute:
  freeze: auto
